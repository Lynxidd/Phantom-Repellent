name: Phantom-Repellent
version: '1.0.4-Paper_Release'
main: io.github.secondary_studios.phantomRepellent.PhantomRepellent
api-version: '26.1.2'
prefix: Phantoms
load: STARTUP
authors: [Secondary Studios, Lynx]
description: Phantom Repellent is a minecraft plugin that allows players to take control of phantom spawning.
website: https://github.com/Secondary-Studios/
commands:
  phantoms:
    description: Toggles the phantoms on or off
    permissions: phantoms.member
    usage: /<command> [get|on|off]
permissions:
 phantoms.command:
  description: Allows users to toggle the status of their phantoms, as well as allowing users to get their current state.
  default: true
 phantoms.admin:
  description: Allows users to toggle the status of other peoples phantoms, as well as allowing users to get others current state.
  default: op
